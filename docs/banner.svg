<svg viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="San Vicente Pickleball Club">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071612"/>
      <stop offset="0.55" stop-color="#0a1c17"/>
      <stop offset="1" stop-color="#04100c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#022c22" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- faint court watermark, right side -->
  <g stroke="#34d399" stroke-opacity="0.10" fill="none" stroke-width="2">
    <rect x="905" y="70" width="300" height="220" rx="6"/>
    <line x1="1055" y1="70" x2="1055" y2="290"/>
    <line x1="905" y1="150" x2="1205" y2="150"/>
    <line x1="905" y1="210" x2="1205" y2="210"/>
  </g>
  <g fill="#34d399" fill-opacity="0.12">
    <circle cx="1150" cy="50" r="5"/>
    <circle cx="1210" cy="120" r="4"/>
    <circle cx="1120" cy="315" r="4"/>
  </g>

  <!-- pickleball mark -->
  <g filter="url(#soft)">
    <circle cx="160" cy="180" r="86" fill="url(#ball)"/>
    <g fill="#06130f" fill-opacity="0.9">
      <circle cx="160" cy="136" r="9"/>
      <circle cx="127" cy="158" r="9"/>
      <circle cx="193" cy="158" r="9"/>
      <circle cx="139" cy="196" r="9"/>
      <circle cx="181" cy="196" r="9"/>
      <circle cx="160" cy="224" r="8"/>
    </g>
    <ellipse cx="132" cy="150" rx="30" ry="18" fill="#ffffff" fill-opacity="0.14"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="300" y="150" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1">San Vicente</text>
    <text x="303" y="196" font-size="29" font-weight="600" fill="#6ee7b7" letter-spacing="11">PICKLEBALL CLUB</text>
    <text x="303" y="234" font-size="18" font-weight="500" fill="#8aa79c">Full-stack club management platform — memberships, open play, tournaments &amp; bookings.</text>

    <!-- tagline pill -->
    <g>
      <rect x="302" y="258" width="214" height="38" rx="19" fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.55"/>
      <circle cx="326" cy="277" r="6" fill="#34d399"/>
      <text x="342" y="283" font-size="16" font-weight="700" fill="#a7f3d0" letter-spacing="0.5">Rallying Since '25</text>
    </g>
  </g>
</svg>
